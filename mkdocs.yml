site_name: async-httpd-data-collector
site_url: https://docs.ahttpdc.piotrkrzysztof.dev/
site_description: "Documentation for async-httpd-data-collector, a Python library that stores NodeMCU sensor readings in InfluxDB: setup, API reference, architecture and analysis."
site_author: Piotr Krzysztof Lis
copyright: Copyright &copy; Piotr Krzysztof Lis
repo_url: https://github.com/straightchlorine/async-httpd-data-collector
repo_name: straightchlorine/async-httpd-data-collector

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections

extra_css:
  - stylesheets/a11y.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/straightchlorine
    - icon: fontawesome/solid/globe
      link: https://piotrkrzysztof.dev

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - API Reference: api.md
  - Data Analysis:
    - Overview: analysis/index.md
    - Forecasting: analysis/prediction.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
